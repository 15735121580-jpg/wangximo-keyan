name: Reproduce the compiler workflow
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.11"
      - run: uv sync --frozen --extra simulator --python 3.12
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/vqa-joint run examples/three-spin-vqe.json --backend standalone --out runs/ci
      - uses: actions/upload-artifact@v4
        with:
          name: complete-vqa-receipt
          path: runs/ci
